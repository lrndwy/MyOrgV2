# =============================================================================
# MyOrg Production Stack — aplikasi saja (frontend, backend, OCR)
# =============================================================================
# Database PostgreSQL & object storage TIDAK di sini:
#   - PostgreSQL : eksternal — diarahkan lewat GOKIL_DB_DSN / GOKIL_DB_HOST di
#                  .env (managed DB, DB di host, atau stack docker-compose.db.yml
#                  kalau memang mau Postgres jalan di Docker yang sama)
#   - S3/MinIO   : eksternal (lihat GOKIL_STORAGE_* di .env)
#
# Usage:
#   docker compose -f docker-compose.prod-service.yml up -d --build
#
# Tidak ada port yang dipublikasikan ke host. Service hanya bisa dijangkau dari
# container lain di network myorg-internal, lewat nama service: frontend:3000,
# gokil:8080, ocr:8090. Reverse proxy (nginx/caddy) harus ikut join network
# myorg-internal, bukan mengarah ke 127.0.0.1.
#
# Network myorg-internal dibuat oleh stack ini (bukan external), jadi stack ini
# bisa jalan sendirian tanpa docker-compose.db.yml.
#
# PITFALL: container lama menyimpan referensi ke network ini (nama + network ID
# + IP endpoint). Kalau network dihapus/dibuat ulang sementara container lama
# masih ada, deploy berikutnya gagal dengan salah satu dari:
#   "could not find a network matching network mode myorg-internal"
#   "failed to set up container networking: Address already in use"
# Keduanya soal state container lama, BUKAN soal ports/expose. Lihat dulu siapa
# yang nyangkut, lalu bersihkan:
#   
#   docker compose -f docker-compose.prod-service.yml down --remove-orphans
#   docker rm -f <container-lama-yang-masih-tertinggal>
#   docker compose -f docker-compose.prod-service.yml up -d --build
# Kalau masih gagal, restart daemon Docker (IPAM/sandbox yang nyangkut).
# =============================================================================

services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_DIRECT_API: ${NEXT_PUBLIC_USE_DIRECT_API}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    expose:
      - "3000"
    depends_on:
      - gokil
    restart: unless-stopped
    networks:
      - internal

  # ── Backend (Go + gokil) ──────────────────────────────────────────────────
  gokil:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: backend
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      ocr:
        condition: service_healthy
    environment:
      OCR_SERVICE_URL: http://ocr:8090
    volumes:
      # Tanpa volume ini, semua file upload (avatar, banner, lampiran, dsb.)
      # hilang setiap kali container di-rebuild/redeploy.
      - gokil_storage:/app/storage
    restart: unless-stopped
    networks:
      - internal

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Tidak ada di stack ini. Backend konek ke DB eksternal lewat GOKIL_DB_DSN
  # (managed DB / DB di host). Kalau Postgres-nya mau di Docker, pakai stack
  # terpisah docker-compose.db.yml — opsional, bukan syarat.
  #
  # ── Redis ──────────────────────────────────────────────────────────────────
  # Tidak dipakai (GOKIL_REDIS_ENABLED=false). gokil v0.9.1 tidak memakai Redis
  # saat runtime — hanya di-scaffold, tidak ada kode yang mengaksesnya.
  #
  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  # Tidak dipakai: storage memakai S3 eksternal (GOKIL_STORAGE_PROVIDER=s3).

  # ── OCR Service (PDF/image text extraction) ────────────────────────────────
  ocr:
    build:
      context: ./backend/ocr
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      OCR_LANG: ${OCR_LANG:-ind+eng}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal

volumes:
  gokil_storage:

networks:
  internal:
    # Dibuat stack ini sendiri (bukan external), tapi dengan nama tetap supaya
    # reverse proxy / stack lain bisa join ke network yang sama — di compose
    # mereka, deklarasikan network myorg-internal sebagai external.
    # Kalau network belum ada, stack ini yang membuatnya; kalau sudah ada,
    # container cuma ikut join.
    name: myorg-internal
    driver: bridge
