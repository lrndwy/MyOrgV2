# =============================================================================
# MyOrg Production Stack — aplikasi saja (frontend, backend, OCR)
# =============================================================================
# Database PostgreSQL & object storage TIDAK di sini:
#   - PostgreSQL : docker-compose.db.yml (stack terpisah, jalankan lebih dulu)
#   - S3/MinIO   : eksternal (lihat GOKIL_STORAGE_* di .env)
#
# Usage:
#   docker compose -f docker-compose.db.yml up -d            # DB dulu
#   docker compose -f docker-compose.prod-service.yml up -d --build
#
# Semua service berbagi network myorg-internal. Network itu dideklarasikan di
# sini DAN di docker-compose.db.yml (bukan external), jadi stack yang start
# lebih dulu yang membuatnya dan stack lain ikut join.
#
# Tidak ada port yang dipublikasikan ke host. Service hanya bisa dijangkau dari
# container lain di network yang sama, lewat nama service: frontend:3000,
# gokil:8080, ocr:8090. Reverse proxy (nginx/caddy) harus ikut join network
# myorg-internal — bukan mengarah ke 127.0.0.1.
# =============================================================================

services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_DIRECT_API: ${NEXT_PUBLIC_USE_DIRECT_API}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    expose:
      - "3000"
    depends_on:
      - gokil
    restart: unless-stopped
    networks:
      - internal

  # ── Backend (Go + gokil) ──────────────────────────────────────────────────
  gokil:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: backend
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      ocr:
        condition: service_healthy
    environment:
      OCR_SERVICE_URL: http://ocr:8090
    volumes:
      # Tanpa volume ini, semua file upload (avatar, banner, lampiran, dsb.)
      # hilang setiap kali container di-rebuild/redeploy.
      - gokil_storage:/app/storage
    restart: unless-stopped
    networks:
      - internal

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Dijalankan terpisah: docker-compose.db.yml
  #
  # ── Redis ──────────────────────────────────────────────────────────────────
  # Tidak dipakai (GOKIL_REDIS_ENABLED=false). gokil v0.9.1 tidak memakai Redis
  # saat runtime — hanya di-scaffold, tidak ada kode yang mengaksesnya.
  #
  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  # Tidak dipakai: storage memakai S3 eksternal (GOKIL_STORAGE_PROVIDER=s3).

  # ── OCR Service (PDF/image text extraction) ────────────────────────────────
  ocr:
    build:
      context: ./backend/ocr
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      OCR_LANG: ${OCR_LANG:-ind+eng}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal

volumes:
  gokil_storage:

networks:
  internal:
    # Dipakai bersama stack DB (docker-compose.db.yml) — nama eksplisit supaya
    # keduanya join network yang sama. Bukan external: kalau belum ada, stack
    # ini yang membuatnya (dan sebaliknya).
    name: myorg-internal
    driver: bridge
