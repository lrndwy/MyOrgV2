# =============================================================================
# MyOrg Production Stack
# =============================================================================
# Usage:
#   cp backend/.env.prod.example backend/.env.prod   # fill in real values
#   cp frontend/.env.prod.example frontend/.env.prod  # fill in real values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All services communicate via Docker internal network.
# No ports are exposed to the host — route traffic via reverse proxy.
# =============================================================================

services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_DIRECT_API: ${NEXT_PUBLIC_USE_DIRECT_API}
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    expose:
      - "3000"
    depends_on:
      - gokil
    restart: unless-stopped
    networks:
      - internal

  # ── Backend (Go + gokil) ──────────────────────────────────────────────────
  gokil:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: backend
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    environment:
      OCR_SERVICE_URL: http://ocr:8090
    restart: unless-stopped
    networks:
      - internal

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${GOKIL_DB_USER}
      POSTGRES_PASSWORD: ${GOKIL_DB_PASSWORD}
      POSTGRES_DB: ${GOKIL_DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOKIL_DB_USER} -d ${GOKIL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   env_file:
  #     - ./backend/.env.prod
  #   environment:
  #     MINIO_ROOT_USER: ${GOKIL_STORAGE_ACCESS_KEY_ID}
  #     MINIO_ROOT_PASSWORD: ${GOKIL_STORAGE_SECRET_ACCESS_KEY}
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - internal

  # ── OCR Service (PDF/image text extraction) ────────────────────────────────
  ocr:
    build:
      context: ./backend/ocr
    restart: unless-stopped
    environment:
      OCR_LANG: ${OCR_LANG:-ind+eng}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal

volumes:
  db_data:
  redis_data:
  # minio_data:

networks:
  internal:
    driver: bridge
